sonar.projectKey=PjuralSzymon_growingNN_pytorch
sonar.organization=pjuralszymon

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=growingNN_pytorch
#sonar.projectVersion=1.0

# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Fail the GitHub Action when the SonarCloud Quality Gate fails.
sonar.qualitygate.wait=true

# Board UI/server and experiment board artifact writer — excluded from static analysis.
sonar.exclusions=**/growingnn_board/**,**/growingnn/board/experiment_board.py
sonar.coverage.exclusions=**/growingnn_board/**,**/growingnn/board/experiment_board.py
sonar.cpd.exclusions=**/growingnn_board/**,**/growingnn/board/experiment_board.py
