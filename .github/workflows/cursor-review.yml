name: Cursor review

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

concurrency:
  group: cursor-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cursor-review:
    name: Trigger Cursor PR review
    runs-on: ubuntu-latest
    steps:
      - name: Post @cursor review comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const marker = `<!-- cursor-review:${pr.head.sha} -->`;
            const body = `${marker}\n@cursor review`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            if (comments.some((comment) => comment.body?.includes(marker))) {
              console.log(`Review already requested for ${pr.head.sha}.`);
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body,
            });
