<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
  <title id="title">Final CIFAR-10 test accuracy, Experiment 009 and MCTS UCB1 C 0.5</title>
  <desc id="desc">Seed 1: Experiment 009 86.25 percent and Experiment 010 83.67 percent. Seed 2: Experiment 009 86.04 percent and Experiment 010 90.34 percent.</desc>
