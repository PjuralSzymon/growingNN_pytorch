    <line x1="90" y1="182" x2="750" y2="182"/><text x="72" y="186" text-anchor="end" stroke="none">60%</text>
    <line x1="90" y1="126" x2="750" y2="126"/><text x="72" y="130" text-anchor="end" stroke="none">80%</text>
    <line x1="90" y1="70" x2="750" y2="70"/><text x="72" y="74" text-anchor="end" stroke="none">100%</text>
